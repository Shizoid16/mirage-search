<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirage — Законодательство</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--line:#243247;--txt:#e5e7eb;--mut:#94a3b8;--acc:#10b981;--radius:12px;--font:15px}
[hidden]{display:none !important}
html{background:var(--bg)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:var(--font)/1.55 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:28px clamp(12px,4vw,60px)}
h1{font-size:34px;margin:0}.sub{color:var(--mut);margin:6px 0 18px}
.tabs,.chips,.seg,.modes,.row{display:flex;flex-wrap:wrap;gap:8px}
.tabs button,.chips button,.seg button,.mode-btn,.chip-btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
.chip-btn{padding:6px 12px;font-size:13px}
.tabs button.on,.seg button.on{background:var(--acc);border-color:var(--acc);color:#04120c;font-weight:600}
.mode-btn.on{outline:2px solid var(--acc)}
.modes{margin:14px 0 10px}
textarea,#q{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:var(--radius);padding:12px 14px;font:inherit}
textarea{min-height:84px;resize:vertical}
.primary{background:var(--acc);border:0;color:#04120c;font-weight:700;padding:10px 22px;border-radius:var(--radius);cursor:pointer}
.row{align-items:center;margin:10px 0}
.hint{color:var(--mut);font-size:13px}
.filters{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}
select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.answer{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:var(--radius);padding:14px 16px;margin:14px 0}
.answer .warn{color:#fbbf24;font-size:13px}.answer .note{color:#7dd3fc}.answer .why{color:var(--mut);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h3{margin:6px 0}.card .row{margin:0}
.badge{font-size:12px;padding:3px 8px;border-radius:6px;background:#1d2a44;color:#9ec1ff}
.num{color:var(--mut);font-size:13px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--mut)}
.chip.sev4,.chip.sev5{color:#fca5a5;border-color:#7f1d1d}
.pen{color:#a7f3d0;margin:4px 0 0}
footer{margin-top:26px;color:var(--mut);font-size:13px}a{color:#7dd3fc}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin:-10px 0 10px}
#modal .mbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;width:300px;display:grid;gap:10px}
#modal input{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;font:inherit}
#hist-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:14px 0;max-height:300px;overflow:auto}
.hitem{padding:8px;border-bottom:1px solid var(--line);cursor:pointer}
.hitem:last-child{border:0}.hitem .d{color:var(--mut);font-size:12px}
#design-btn{position:fixed;right:18px;bottom:18px;z-index:50;border-radius:999px}
#design-panel{position:fixed;right:18px;bottom:70px;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;width:280px;gap:8px}
#design-panel label{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:13px}
#design-panel input[type=color]{width:44px;height:26px;border:1px solid var(--line);background:none;padding:0}
#design-panel input[type=range]{width:120px}
#design-panel .row button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt);cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div id="bgfix" style="position:fixed;left:0;top:0;right:0;bottom:0;background:#0b1220;z-index:-1"></div>

<div class="topbar">
  <span id="auth">
    <button id="btn-login" class="chip-btn">Войти</button>
    <button id="btn-reg" class="chip-btn">Регистрация</button>
  </span>
  <span id="userbox" style="display:none">
    <span id="uname" class="badge"></span>
    <button id="btn-hist" class="chip-btn">История</button>
    <button id="btn-logout" class="chip-btn">Выйти</button>
  </span>
</div>

<h1>Mirage</h1>
<p class="sub">Законодательство штата Сан-Андреас · Nova RP · поиск без ИИ и без API</p>
<nav id="codes" class="tabs"></nav>
<div class="modes">
  <button class="mode-btn on" data-mode="sit">Разбор ситуации</button>
  <button class="mode-btn" data-mode="quick">Быстрый поиск</button>
</div>
<section id="panel-sit">
  <textarea id="sit" placeholder="Опиши ситуацию: снял телефон с прилавка, побежал, поймали у выхода…"></textarea>
  <div class="row"><button id="go" class="primary">Разобрать</button><span class="hint">Ctrl+Enter</span></div>
  <div id="chips" class="chips"></div>
  <div id="answer" class="answer" hidden></div>
  <div id="follow" class="chips"></div>
</section>
<section id="panel-quick" hidden>
  <input id="q" type="text" placeholder="Поиск: номер статьи, слово, наказание…">
</section>
<div class="filters">
  <div id="scope" class="seg">
    <button data-scope="any" class="on">Любой</button>
    <button data-scope="F">Федеральные (F)</button>
    <button data-scope="R">Региональные (R)</button>
  </div>
  <select id="wanted">
    <option value="0">Розыск: любой</option>
    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
    <option value="4">4</option><option value="5">5</option>
  </select>
</div>
<main id="results" class="grid"></main>
<footer>Автоподбор статей по ключевым словам — не заменяет кодекс. Актуальная редакция:
<a href="https://forum.grand-rp.su/threads/410588/">форум проекта</a></footer>

<div id="hist-panel" style="display:none"><h3>История запросов</h3><div id="hist-list"></div></div>

<div id="modal" style="display:none"><div class="mbox">
  <h3 id="m-title">Вход</h3>
  <input id="m-login" placeholder="Логин">
  <input id="m-pass" type="password" placeholder="Пароль">
  <div class="row"><button id="m-go" class="primary">Войти</button>
  <button id="m-switch" class="chip-btn">Нет аккаунта? Регистрация</button></div>
  <p id="m-err" class="hint" style="color:#fbbf24"></p>
</div></div>

<button id="design-btn" class="primary">Дизайн</button>
<div id="design-panel" style="display:none">
  <div class="row"><h3 style="margin:0">Дизайн сайта</h3><button id="th-close" class="chip-btn">✕</button></div>
  <div class="row" id="presets">
    <button data-preset="dark">Тёмная</button><button data-preset="light">Светлая</button>
    <button data-preset="neon">Неон</button><button data-preset="paper">Бумага</button>
  </div>
  <label>Фон <input id="th-bg" type="color"></label>
  <label>Панели <input id="th-panel" type="color"></label>
  <label>Границы <input id="th-line" type="color"></label>
  <label>Текст <input id="th-txt" type="color"></label>
  <label>Вторичный <input id="th-mut" type="color"></label>
  <label>Акцент <input id="th-acc" type="color"></label>
  <label>Скругление <input id="th-radius" type="range" min="0" max="24"></label>
  <label>Шрифт <input id="th-font" type="range" min="13" max="18"></label>
  <div class="row">
    <button id="th-copy">Скопировать</button>
    <button id="th-paste">Вставить</button>
    <button id="th-share">Ссылка</button>
    <button id="th-reset">Сброс</button>
  </div>
  <p class="hint">Хранится в этом браузере. «Ссылка» — ссылка с темой для пацанов.</p>
</div>

<script src="js/data.js"></script>
<script src="js/search.js"></script>
<script src="js/theme.js"></script>
<script src="js/db.js"></script>
</body>
</html>
